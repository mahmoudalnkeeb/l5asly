server {
  listen 80;
  root /usr/share/nginx/html;

  # Matches the API's default MAX_UPLOAD_MB. Raise both together.
  client_max_body_size 1024m;

  # Re-resolve the api container through Docker's DNS, so recreating it
  # (which can change its IP) doesn't leave nginx pointing at the old address.
  resolver 127.0.0.11 valid=10s;
  set $api_upstream http://api:4000;

  location /api/ {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Stream uploads straight to the API instead of spooling them to nginx's disk first.
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Vite fingerprints these file names, so they can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes fall back to the app shell.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
