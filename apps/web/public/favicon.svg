<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Same geometry as src/components/logo.tsx. The default green stays
       legible on light and dark tab bars; browsers that support media
       queries in favicons get the lighter dark-mode brand green. -->
  <style>
    .mark { fill: #2f8a55; stroke: #2f8a55; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #9cd5aa; stroke: #9cd5aa; }
    }
  </style>
  <mask id="summary-bars" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48">
    <rect width="48" height="48" fill="white"/>
    <path d="M19 18.5H27.5M19 24H32.5M19 29.5H24.5" stroke="black" stroke-width="3.5" stroke-linecap="round"/>
  </mask>
  <polygon class="mark" points="16,10 16,38 41,24" stroke-width="6" stroke-linejoin="round" mask="url(#summary-bars)"/>
</svg>
