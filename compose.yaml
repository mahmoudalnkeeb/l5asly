# Local services for development. The API connects to Redis through REDIS_URL.
services:
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    # BullMQ requires Redis to never evict keys.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]

volumes:
  redis-data:
